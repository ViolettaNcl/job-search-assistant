<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Violetta — Daily Application Queue</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #17191f; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 18px 60px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    h1 { margin: 0 0 7px; font-size: clamp(24px, 4vw, 38px); letter-spacing: -.03em; }
    .sub { color: #686d78; max-width: 720px; line-height: 1.5; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin: 18px 0; padding: 14px; background: white; border: 1px solid #e2e5ea; border-radius: 14px; }
    label { display: grid; gap: 5px; font-size: 12px; color: #626874; }
    select, button, a.button { min-height: 38px; border-radius: 9px; border: 1px solid #d7dae0; background: white; color: #17191f; padding: 8px 12px; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button.primary, a.primary { background: #17191f; color: white; border-color: #17191f; }
    button:disabled { opacity: .55; cursor: default; }
    .summary { display: flex; gap: 9px; flex-wrap: wrap; margin: 14px 0 18px; }
    .summary span { background: white; border: 1px solid #e2e5ea; border-radius: 999px; padding: 7px 10px; font-size: 12px; }
    #list { display: grid; gap: 12px; }
    .job { background: white; border: 1px solid #e2e5ea; border-radius: 15px; padding: 16px; box-shadow: 0 2px 10px rgba(20, 24, 33, .035); }
    .jobTop { display: grid; grid-template-columns: auto 1fr auto; gap: 13px; align-items: start; }
    .rank { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #f0f1f4; font-weight: 800; }
    .title { font-size: 17px; font-weight: 780; line-height: 1.25; }
    .company { color: #666d79; margin-top: 4px; font-size: 13px; }
    .score { font-weight: 850; font-size: 22px; text-align: right; }
    .score small { display: block; color: #767d88; font-size: 10px; font-weight: 600; }
    .meta, .skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .pill { padding: 5px 8px; border-radius: 999px; background: #f3f4f6; font-size: 11px; }
    .pill.now { background: #e8f8ee; color: #126333; }
    .pill.today { background: #eef3ff; color: #254f9b; }
    .pill.eligible { background: #e8f8ee; color: #126333; }
    .pill.warn { background: #fff4e6; color: #8a5410; }
    .details { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .box { padding: 10px 11px; border-radius: 10px; background: #f8f9fa; font-size: 12px; line-height: 1.45; }
    .box strong { display: block; margin-bottom: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .actions button, .actions a { font-size: 12px; min-height: 34px; padding: 7px 10px; }
    .empty, .error { padding: 22px; background: white; border: 1px solid #e2e5ea; border-radius: 14px; color: #676e79; }
    .error { color: #a32035; background: #fff5f6; }
    .status { color: #6d7480; font-size: 12px; align-self: center; }
    @media (max-width: 720px) {
      header { display: block; }
      .jobTop { grid-template-columns: auto 1fr; }
      .score { grid-column: 2; text-align: left; font-size: 18px; }
      .details { grid-template-columns: 1fr; }
    }
  </style>
  <style>
    body{background:radial-gradient(circle at 8% 0,rgba(98,85,217,.10),transparent 28rem),radial-gradient(circle at 92% 8%,rgba(59,192,145,.09),transparent 24rem),#f6f7fb;color:#19233d}
    main{max-width:1220px;padding-top:32px}h1{color:#19233d}.sub{color:#667085}
    .toolbar,.job,.empty{border-color:#e1e4ec;box-shadow:0 10px 30px rgba(49,46,129,.07)}
    .toolbar{border-radius:18px;padding:16px}.job{border-radius:18px;padding:18px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.job:hover{transform:translateY(-1px);border-color:#d1cdf3;box-shadow:0 14px 36px rgba(49,46,129,.1)}
    select,button,a.button{border-color:#dfe2ea;border-radius:10px;color:#424b62}button.primary,a.primary{background:linear-gradient(135deg,#6255d9,#7567ed);border-color:transparent;box-shadow:0 5px 13px rgba(98,85,217,.18)}button:hover,a.button:hover{border-color:#c9c5f0;background:#f6f5ff;color:#5146bb}button.primary:hover,a.primary:hover{background:linear-gradient(135deg,#4d42bd,#6255d9);color:#fff}
    .rank{background:#eeecff;color:#574bc0}.score{color:#19815c}.pill{background:#f2f3f7}.box{background:#f8f8fc}.summary span{border-color:#e1e4ec;box-shadow:0 4px 12px rgba(49,46,129,.04)}
    button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid rgba(98,85,217,.22);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Daily Application Queue</h1>
      <p class="sub">The strongest unapplied jobs first, ranked by Violetta's fit, work eligibility and vacancy freshness. Use this as the daily shortlist instead of opening dozens of random listings.</p>
    </div>
    <a class="button" href="/">Dashboard</a>
  </header>

  <div class="toolbar">
    <label>Minimum fit
      <select id="minScore">
        <option value="65">65+ — include review</option>
        <option value="75" selected>75+ — strong applications</option>
        <option value="85">85+ — high priority only</option>
      </select>
    </label>
    <label>Queue size
      <select id="limit">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="30">30</option>
        <option value="50">50</option>
      </select>
    </label>
    <button id="refresh" class="primary">Refresh queue</button>
    <button id="collect">Collect new jobs first</button>
    <span id="status" class="status"></span>
  </div>

  <div id="summary" class="summary"></div>
  <section id="list"><div class="empty">Loading the best applications…</div></section>
</main>

<script>
const $ = id => document.getElementById(id);
let queue = [];

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function priorityClass(value) {
  if (value === "Apply now") return "now";
  if (value === "Today") return "today";
  return "";
}
function splitSkills(value) {
  return String(value || "").split(',').map(x => x.trim()).filter(Boolean).slice(0, 8);
}
function fmtDate(value) {
  if (!value) return "";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
async function copyText(text, button) {
  await navigator.clipboard.writeText(text || "");
  const old = button.textContent;
  button.textContent = "Copied ✓";
  setTimeout(() => button.textContent = old, 1100);
}
async function applyHh(item, button) {
  if (!confirm(`Apply to ${item.title} at ${item.company} through HH now?\n\nFit: ${item.matchScore}/100`)) return;
  button.disabled = true;
  try {
    const response = await fetch(`/api/vacancies/${item.vacancyId}/apply-tailored`, { method: "POST" });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.errorText || data.errorCode || `HTTP ${response.status}`);
    button.textContent = "Applied ✓";
    await loadQueue();
  } catch (error) {
    button.disabled = false;
    alert(error.message || String(error));
  }
}
function render() {
  const now = queue.filter(x => x.priority === "Apply now").length;
  const today = queue.filter(x => x.priority === "Today").length;
  const eligible = queue.filter(x => x.eligibilityStatus === "Eligible").length;
  $("summary").innerHTML = `<span><strong>${queue.length}</strong> jobs in queue</span><span><strong>${now}</strong> apply now</span><span><strong>${today}</strong> today</span><span><strong>${eligible}</strong> eligibility confirmed</span>`;
  if (!queue.length) {
    $("list").innerHTML = '<div class="empty">No new jobs meet this filter. Try 65+, or collect fresh vacancies.</div>';
    return;
  }
  $("list").innerHTML = queue.map((item, index) => {
    const matched = splitSkills(item.matchedSkills).map(x => `<span class="pill">${esc(x)}</span>`).join('');
    const missing = splitSkills(item.missingSkills).map(x => `<span class="pill warn">Gap: ${esc(x)}</span>`).join('');
    const source = String(item.source || '').toLowerCase();
    const hh = source.includes('headhunter') || source === 'hh';
    const date = fmtDate(item.publishedAt || item.firstSeenAt);
    return `<article class="job">
      <div class="jobTop">
        <div class="rank">${index + 1}</div>
        <div><div class="title">${esc(item.title)}</div><div class="company">${esc(item.company)}${item.country ? ' · ' + esc(item.country) : ''}${item.location ? ' · ' + esc(item.location) : ''}</div></div>
        <div class="score">${item.matchScore}<small>fit / 100 · priority ${item.priorityScore}</small></div>
      </div>
      <div class="meta">
        <span class="pill ${priorityClass(item.priority)}">${esc(item.priority)}</span>
        <span class="pill ${item.eligibilityStatus === 'Eligible' ? 'eligible' : 'warn'}">${esc(item.eligibilityStatus)}</span>
        <span class="pill">${esc(item.source)}</span>
        ${date ? `<span class="pill">${esc(date)}</span>` : ''}
        <span class="pill">CV: ${esc(item.recommendedCv)}</span>
      </div>
      <div class="skills">${matched}${missing}</div>
      <div class="details">
        <div class="box"><strong>Positioning</strong>${esc(item.recommendedHeadline)}</div>
        <div class="box"><strong>Why this priority</strong>${esc(item.priorityReason)}${item.learningBoost ? ` (${item.learningBoost > 0 ? '+' : ''}${item.learningBoost})` : ''}</div>
        <div class="box"><strong>Eligibility</strong>${esc(item.eligibilityReason || 'Verify employer location/payroll details.')}</div>
      </div>
      <div class="actions">
        <a class="button primary" href="${esc(item.url)}" target="_blank" rel="noopener">Open vacancy</a>
        <button onclick="copyText(queue[${index}].shortMessage, this)">Copy short message</button>
        ${hh && item.matchScore >= 75 ? `<button onclick="applyHh(queue[${index}], this)">Apply via HH API</button>` : ''}
      </div>
    </article>`;
  }).join('');
}
async function loadQueue() {
  $("status").textContent = "Loading…";
  try {
    const minScore = $("minScore").value;
    const limit = $("limit").value;
    const response = await fetch(`/api/application-queue?limit=${encodeURIComponent(limit)}&minScore=${encodeURIComponent(minScore)}`);
    if (!response.ok) throw new Error(`Queue returned ${response.status}`);
    queue = await response.json();
    render();
    $("status").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  } catch (error) {
    $("list").innerHTML = `<div class="error">${esc(error.message || String(error))}</div>`;
    $("status").textContent = "Could not load";
  }
}
async function collect() {
  const button = $("collect");
  button.disabled = true;
  $("status").textContent = "Collecting vacancies…";
  try {
    const response = await fetch('/api/collect', { method: 'POST' });
    if (!response.ok) throw new Error(`Collection returned ${response.status}`);
    const result = await response.json();
    $("status").textContent = `Added ${result.added ?? 0} new jobs`;
    await loadQueue();
  } catch (error) {
    $("status").textContent = error.message || String(error);
  } finally {
    button.disabled = false;
  }
}
$("refresh").addEventListener('click', loadQueue);
$("collect").addEventListener('click', collect);
$("minScore").addEventListener('change', loadQueue);
$("limit").addEventListener('change', loadQueue);
loadQueue();
</script>
</body>
</html>
