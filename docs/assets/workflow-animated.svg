<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Violetta Apply Assistant workflow</title>
  <desc id="desc">Animated workflow from vacancy discovery through explainable fit, application preparation, review, submission, recruiter response, and outcome learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="190" rx="24" fill="url(#bg)"/>
  <text x="48" y="42" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Personal job-search operating loop</text>
  <text x="48" y="66" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Local-first · explainable decisions · review-gated automation</text>

  <path id="track" d="M85 125 H1110" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <path d="M85 125 H1110" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(100 125)"><circle r="19" fill="#171f36" stroke="#8b5cf6" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">01</text><text y="48" font-size="11" fill="#cbd5e1">Discover</text></g>
    <g transform="translate(265 125)"><circle r="19" fill="#171f36" stroke="#7c83ff" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">02</text><text y="48" font-size="11" fill="#cbd5e1">Analyze</text></g>
    <g transform="translate(430 125)"><circle r="19" fill="#171f36" stroke="#38bdf8" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">03</text><text y="48" font-size="11" fill="#cbd5e1">Fit + risks</text></g>
    <g transform="translate(595 125)"><circle r="19" fill="#171f36" stroke="#22d3ee" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">04</text><text y="48" font-size="11" fill="#cbd5e1">Prepare</text></g>
    <g transform="translate(760 125)"><circle r="19" fill="#171f36" stroke="#14b8a6" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">05</text><text y="48" font-size="11" fill="#cbd5e1">Review gate</text></g>
    <g transform="translate(925 125)"><circle r="19" fill="#171f36" stroke="#22c55e" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">06</text><text y="48" font-size="11" fill="#cbd5e1">Apply</text></g>
    <g transform="translate(1090 125)"><circle r="19" fill="#171f36" stroke="#84cc16" stroke-width="2"/><text y="5" font-size="11" font-weight="700" fill="#f8fafc">07</text><text y="48" font-size="11" fill="#cbd5e1">Learn</text></g>
  </g>

  <circle r="8" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.2;1;1;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
