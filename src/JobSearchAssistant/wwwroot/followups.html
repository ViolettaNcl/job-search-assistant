<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Follow-up Queue · Violetta Job Assistant</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#21172b;background:#f7f5f9;line-height:1.45;--ink:#21172b;--muted:#746a7c;--line:#e7e0eb;--panel:#fff;--accent:#6841a5;--soft:#f0e9f8;--good:#287a55;--warn:#9a6a13;--shadow:0 10px 32px rgba(52,35,67,.07)}
    *{box-sizing:border-box}body{margin:0}.shell{max-width:1040px;margin:auto;padding:28px 20px 60px}.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.header h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:#4d3461;text-decoration:none;cursor:pointer;font:inherit;font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.controls{display:grid;grid-template-columns:180px 180px auto;gap:10px;align-items:end;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:700}select{font:inherit;padding:9px 10px;border:1px solid #d9d0df;border-radius:9px;background:#fff}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0 10px}.summary h2{margin:0;font-size:19px}.jobs{display:grid;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;gap:16px}.card h3{margin:0 0 4px;font-size:18px}.company{font-weight:700}.meta{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f4f1f6;color:#55485d;font-size:11px;font-weight:800}.badge.due{background:#fff2db;color:#845a0f}.badge.score{background:#eee7f7;color:#54317f}.badge.lang{background:#eaf6ef;color:#27684b}.message{width:100%;min-height:145px;resize:vertical;border:1px solid #ddd4e3;border-radius:10px;padding:11px;font:inherit;line-height:1.5;color:var(--ink);background:#fcfbfd}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions>*{font:inherit;font-size:13px}.empty{padding:34px 18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9d0df;border-radius:14px}.error{padding:12px;border-radius:10px;background:#fff0f1;color:#8d3540}.priority{font-size:24px;font-weight:850;text-align:right}.priority small{display:block;font-size:10px;color:var(--muted)}
    @media(max-width:700px){.shell{padding:18px 14px 40px}.header,.card-head{flex-direction:column}.controls{grid-template-columns:1fr}.priority{text-align:left}.actions>*{flex:1;text-align:center}}
  </style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div>
      <h1>Follow-up Queue</h1>
      <div class="muted">Отклики без ответа, которые уже пора аккуратно напомнить рекрутеру. После ответа/интервью вакансия автоматически исчезает из этой очереди.</div>
    </div>
    <div class="toolbar">
      <a class="btn" href="/">← Dashboard</a>
      <a class="btn" href="/queue.html">Daily Apply Queue</a>
    </div>
  </header>

  <section class="controls">
    <label>Ждать рабочих дней
      <select id="days">
        <option value="3">3 дня</option>
        <option value="5" selected>5 дней</option>
        <option value="7">7 дней</option>
        <option value="10">10 дней</option>
      </select>
    </label>
    <label>Максимум follow-up
      <select id="attempts">
        <option value="1">1 попытка</option>
        <option value="2" selected>2 попытки</option>
        <option value="3">3 попытки</option>
      </select>
    </label>
    <button class="btn primary" id="refresh">Обновить очередь</button>
  </section>

  <div class="summary"><h2>Нужно проверить сегодня</h2><span id="count" class="muted">—</span></div>
  <div id="jobs" class="jobs"><div class="empty">Загрузка…</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[];
async function api(url,opt){const r=await fetch(url,opt);const txt=await r.text();let data;try{data=JSON.parse(txt)}catch{data=txt}if(!r.ok)throw new Error(typeof data==='string'?data:(data.message||JSON.stringify(data)));return data}
function formatDate(value){try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(value))}catch{return value||'—'}}
function card(x){
  const attempt=x.followUpCount+1;
  return `<article class="card" data-id="${esc(x.vacancyId)}">
    <div class="card-head">
      <div><h3>${esc(x.title)}</h3><div class="company">${esc(x.company)}</div><div class="meta">${esc(x.source)} · ${esc(x.market)} · отклик ${formatDate(x.appliedAt)}</div></div>
      <div class="priority">${esc(x.priorityScore)}<small>follow-up priority</small></div>
    </div>
    <div class="badges">
      <span class="badge due">⏳ ${esc(x.businessDaysWaiting)} рабочих дней</span>
      <span class="badge score">Fit ${esc(x.matchScore)}/100</span>
      <span class="badge lang">${x.language==='ru'?'RU':'EN'} · попытка ${attempt}</span>
      <span class="badge">${esc(x.recommendedChannel)}</span>
    </div>
    <textarea class="message" id="msg-${esc(x.vacancyId)}">${esc(x.message)}</textarea>
    <div class="actions">
      <button class="btn" onclick="copyMessage('${esc(x.vacancyId)}')">Copy message</button>
      <a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть вакансию</a>
      <button class="btn primary" onclick="markSent('${esc(x.vacancyId)}')">Отметить follow-up отправленным</button>
    </div>
  </article>`;
}
async function load(){
  $('jobs').innerHTML='<div class="empty">Загрузка…</div>';
  try{
    const days=$('days').value,attempts=$('attempts').value;
    items=await api(`/api/followups?afterBusinessDays=${encodeURIComponent(days)}&maxAttempts=${encodeURIComponent(attempts)}&limit=50`);
    $('count').textContent=`${items.length} ${items.length===1?'application':'applications'}`;
    $('jobs').innerHTML=items.length?items.map(card).join(''):'<div class="empty">Сейчас follow-up не требуется. Очередь появится, когда отклик достаточно долго остаётся без ответа.</div>';
  }catch(e){$('jobs').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
async function copyMessage(id){
  const text=$(`msg-${id}`).value;
  await navigator.clipboard.writeText(text);
  const card=document.querySelector(`[data-id="${CSS.escape(id)}"]`);const btn=card?.querySelector('button');if(btn){const old=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=old,1200)}
}
async function markSent(id){
  if(!confirm('Отметить, что follow-up уже отправлен? Очередь отложит следующую попытку на выбранное число рабочих дней.'))return;
  try{
    await api(`/api/vacancies/${encodeURIComponent(id)}/followup-sent`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:'Follow-up sent from Follow-up Queue'})});
    await load();
  }catch(e){alert(e.message)}
}
$('refresh').addEventListener('click',load);$('days').addEventListener('change',load);$('attempts').addEventListener('change',load);load();
</script>
</body>
</html>
