<!doctype html><html><head><meta charset="UTF-8"><title>Recruiter chat</title><style>body{font:15px/1.6 system-ui;margin:50px auto;max-width:850px;color:#2d2639}main{border:1px solid #ddd;border-radius:16px;padding:25px}.history{height:240px;overflow:auto;background:#f6f5f9;padding:15px}.message{padding:8px 12px;border-radius:10px;background:white;margin:8px}.outgoing{margin-left:70px;background:#eee9fa}textarea{width:95%;height:95px;padding:10px;margin-top:50px;border:1px solid #bfb5ce;border-radius:9px}button{padding:9px;margin:8px}</style></head><body><main data-conversation-id="chat-A" data-vacancy-id="support-1"><h1>Recruiter — Fixture Company</h1><a href="/jobs/support-1">Technical Support Specialist</a><div class="history"><div data-history-start></div><div data-message-id="m1" data-sender="candidate" class="message outgoing">Здравствуйте!</div><div data-message-id="m2" data-sender="employer" class="message incoming">Спасибо! Мы рассмотрим ваше резюме и вернёмся с обратной связью.</div></div><form id="chat-form"><textarea aria-label="Сообщение" name="message"></textarea><button type="submit">Send</button></form></main><script>window.sends=0;document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();window.sends++});window.switchThread=(id='chat-B',job='developer-2')=>{document.querySelector('main').dataset.conversationId=id;document.querySelector('main').dataset.vacancyId=job;document.querySelector('main a').href='/jobs/'+job;document.querySelector('main a').textContent='Junior .NET Developer';document.querySelector('.incoming').textContent='Пришлите ваш Telegram.';document.querySelector('textarea').value='';};</script></body></html>
