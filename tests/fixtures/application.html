<!doctype html><html><head><meta charset="UTF-8"><title>Support role</title><style>body{font:16px/1.6 system-ui;margin:40px;max-width:800px}label{display:block;margin:8px}input,textarea,select{display:block;padding:6px}textarea{width:500px}button{padding:10px}</style></head><body><main data-job-id="support-1"><h1>Technical Support Specialist</h1><span class="company-name">Fixture Company</span><div class="job-description">Help customers troubleshoot issues and explain solutions. English communication, remote technical support.</div><form id="application"><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input type="tel" name="phone"></label><label>GitHub<input name="github"></label><label>Expected salary<input name="salary" required></label><label>Years of commercial experience<input type="number" name="years" required></label><label>Resume PDF<input name="resume" type="file" accept=".pdf" required></label><label>Portfolio attachment<input name="portfolio" type="file"></label><label>Cover letter<textarea name="coverLetter"></textarea></label><label><input name="consent" type="checkbox" required>I agree to legal terms and privacy policy</label><button type="submit">Submit application</button></form></main><script>window.submits=0;document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();window.submits++});</script></body></html>
