<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Вакансии — HeadHunter (test fixture)</title>
<style>
body{font:16px Arial;margin:0;color:#182331;background:white}nav{background:#171b22;color:white;padding:18px}main{max-width:920px;margin:30px auto}#tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{padding:9px 12px;cursor:pointer;border:1px solid #cfd6e3;border-radius:8px;background:white}button[aria-selected=true]{background:#171b22;color:white}[data-card-fixture]{border:1px solid #d8e0ed;border-radius:16px;padding:20px;margin:16px 0}h2{font-size:20px}a{color:#182331;text-decoration:none}p{margin:8px 0}.actions{margin-top:18px}.native-apply{background:#067bff;color:white}.fixture-overlay{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;z-index:500}.fixture-modal{background:white;border-radius:20px;padding:25px;width:600px}.fixture-modal textarea{width:100%;min-height:210px;margin:20px 0}.fixture-modal footer{display:flex;justify-content:space-between}header{margin-bottom:10px}
</style></head><body><nav>HeadHunter · Резюме и профиль · Отклики · Помощь</nav><main><h1>Вакансии</h1><form id="filters"><input required aria-label="Профессия, должность или компания" placeholder="Профессия, должность или компания"></form><div id="tabs" role="tablist"></div><div id="feed"></div></main>
<script>
window.fixtureSent=[];window.nativeClicks=[];window.authorizations=[];
const titles={'779':'Специалист технической поддержки','780':'Менеджер по работе с клиентами в чатах','781':'Консультант банка','782':'Специалист по автоматизации и внутренним сервисам','785':'Специалист технической поддержки / Support L1','786':'Junior .NET Backend Developer'};
const feeds={'Для вас':['779','780','781'],'У дома':['779','782'],'Подработка':['780'],'Вахта':['781'],'от 16 лет':['786'],'Удаленная работа':['785']};
window.cardHtml=function(id,variant=0){const body=`<header><h2 class="vacancy-card--title-wrapper"><a data-qa="vacancy-card__title" href="/vacancy/${id}?hhtmFromLabel=for_you">${titles[id]||'Тестовая вакансия'}</a></h2></header><p>57 000–68 000 ₽ · Опыт 1–3 года · Можно удалённо</p><div data-qa="vacancy-card__company">Fixture Employer</div><div data-qa="vacancy-card__location">Самара</div><div class="actions"><button type="button" class="native-apply">Откликнуться</button></div>`;return variant===1?`<article data-card-fixture="${id}">${body}</article>`:`<div data-card-fixture="${id}" ${variant===0?'data-qa="vacancy-card"':'class="magritte-card-fixture"'}>${body}</div>`;};
window.showFeed=function(label){document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.textContent===label)));feed.innerHTML=feeds[label].map((id,i)=>cardHtml(id,i)).join('');};
for(const label of Object.keys(feeds)){const b=document.createElement('button');b.type='button';b.role='tab';b.textContent=label;b.setAttribute('aria-selected','false');b.onclick=()=>showFeed(label);tabs.append(b);}
document.addEventListener('click',e=>{
 const native=e.target.closest('.native-apply');if(!native)return;const card=native.closest('[data-card-fixture]'),id=card.dataset.cardFixture;
 window.nativeClicks.push(id);native.remove();const applied=document.createElement('p');applied.textContent='Вы откликнулись';card.append(applied);
 const attach=document.createElement('button');attach.textContent='Приложить письмо';card.append(attach);
 attach.onclick=()=>{const overlay=document.createElement('div');overlay.className='fixture-overlay';overlay.innerHTML=`<section class="fixture-modal" role="dialog"><h2>Сопроводительное письмо</h2><textarea placeholder="Сопроводительное письмо"></textarea><footer><button class="close">Закрыть</button><button class="send">Отправить</button></footer></section>`;document.body.append(overlay);overlay.querySelector('.close').onclick=()=>overlay.remove();overlay.querySelector('.send').onclick=()=>{fixtureSent.push({id,text:overlay.querySelector('textarea').value});attach.remove();applied.textContent='Сопроводительное письмо отправлено';overlay.remove();};};
});
</script></body></html>
