name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/JobSearchAssistant/JobSearchAssistant.csproj
      - run: dotnet build src/JobSearchAssistant/JobSearchAssistant.csproj -c Release --no-restore
      - run: dotnet test tests/JobSearchAssistant.Tests/JobSearchAssistant.Tests.csproj -c Release
      - name: Verify SQLite HTTP workflows and restart persistence
        run: python scripts/verify-sqlite-runtime.py
      - name: Validate extension JavaScript
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/browser-autopilot.js
          node --check browser-extension/runtime-guard.js
          node --check browser-extension/site-apply.js
          node --check browser-extension/site-apply-content.js
          node --check browser-extension/site-apply-popup.js
          node --check browser-extension/ats-structured.js
          node --check browser-extension/ats-controls.js
          node --check browser-extension/field-verification.js
          node --check browser-extension/fill-reconciliation.js
          node --check browser-extension/content.js
          node --check browser-extension/review-navigator-content.js
          node --check browser-extension/final-submit-control.js
          node --check browser-extension/final-submit-locator.js
          node --check browser-extension/submission-receipt.js
          node --check browser-extension/submission-receipt-content.js
          node --check browser-extension/followup-desk.js
          node --check browser-extension/submission-readiness.js
          node --check browser-extension/application-session.js
          node --check browser-extension/application-step-intelligence.js
          node --check browser-extension/daily-queue.js
          node --check browser-extension/queue-defer.js
          node --check browser-extension/prepare-application.js
          node --check browser-extension/review-navigator.js
          node --check browser-extension/candidate-confirmation.js
          node --check browser-extension/final-review-gate.js
          node --check browser-extension/candidate-local-profile.js
          node --check browser-extension/setup-readiness.js
          node --check browser-extension/application-continuation.js
          node --check browser-extension/popup.js
          node --check browser-extension/local-contact-profile-popup.js
          node --check browser-extension/cv-upload.js
          node --check browser-extension/cv-vault-popup.js
          node --check browser-extension/review-summary.js
          node --check browser-extension/post-fill-auto-recheck.js
          node --check browser-extension/multistep-session-popup.js
          node --check browser-extension/step-intelligence-popup.js
          node --check browser-extension/daily-loop-popup.js
          node --check browser-extension/followup-desk-popup.js
          node --check browser-extension/prepare-application-popup.js
          node --check browser-extension/review-navigator-popup.js
          node --check browser-extension/candidate-confirmation-popup.js
          node --check browser-extension/final-review-popup.js
          node --check browser-extension/submission-receipt-popup.js
          node --check browser-extension/options.js
          node --check browser-extension/ats-structured.test.js
          node --check browser-extension/ats-controls.test.js
          node --check browser-extension/field-verification.test.js
          node --check browser-extension/fill-reconciliation.test.js
          node --check browser-extension/submission-readiness.test.js
          node --check browser-extension/application-session.test.js
          node --check browser-extension/application-step-intelligence.test.js
          node --check browser-extension/daily-queue.test.js
          node --check browser-extension/queue-defer.test.js
          node --check browser-extension/prepare-application.test.js
          node --check browser-extension/review-navigator.test.js
          node --check browser-extension/candidate-confirmation.test.js
          node --check browser-extension/candidate-confirmation-session.test.js
          node --check browser-extension/final-submit-control.test.js
          node --check browser-extension/final-review-gate.test.js
          node --check browser-extension/submission-receipt.test.js
          node --check browser-extension/submission-receipt-session.test.js
          node --check browser-extension/followup-desk.test.js
          node --check browser-extension/candidate-local-profile.test.js
          node --check browser-extension/setup-readiness.test.js
          node --check browser-extension/application-continuation.test.js
          node --check browser-extension/browser-autopilot.test.js
          node --check browser-extension/site-apply.test.js
          node --check browser-extension/runtime-guard.test.js
          node --check browser-extension/screening-popup.js
          node --check browser-extension/autopilot-popup.js
          node --check browser-extension/hh-discovery-content.js
          node --check browser-extension/hh-discovery-background.js
          node --check browser-extension/hh-discovery-navigation.js
      - name: Test ATS structured extraction
        run: node browser-extension/ats-structured.test.js
      - name: Test ATS custom controls
        run: node browser-extension/ats-controls.test.js
      - name: Test persisted autofill verification
        run: node browser-extension/field-verification.test.js
      - name: Test corrected-fill reconciliation
        run: node browser-extension/fill-reconciliation.test.js
      - name: Test submission readiness
        run: node browser-extension/submission-readiness.test.js
      - name: Test multi-step ATS sessions
        run: node browser-extension/application-session.test.js
      - name: Test ATS application stage intelligence
        run: node browser-extension/application-step-intelligence.test.js
      - name: Test daily apply queue selection
        run: node browser-extension/daily-queue.test.js
      - name: Test queue deferral request format
        run: node browser-extension/queue-defer.test.js
      - name: Test one-click preparation result model
        run: node browser-extension/prepare-application.test.js
      - name: Test review-field navigation order
        run: node browser-extension/review-navigator.test.js
      - name: Test candidate-confirmation privacy and invalidation
        run: node browser-extension/candidate-confirmation.test.js
      - name: Test candidate-confirmation ATS session persistence
        run: node browser-extension/candidate-confirmation-session.test.js
      - name: Test conservative final submit classification
        run: node browser-extension/final-submit-control.test.js
      - name: Test Final Review Gate states
        run: node browser-extension/final-review-gate.test.js
      - name: Test Submission Receipt signals
        run: node browser-extension/submission-receipt.test.js
      - name: Test Submission Receipt ATS session restoration
        run: node browser-extension/submission-receipt-session.test.js
      - name: Test Follow-up Desk ranking and request safety
        run: node browser-extension/followup-desk.test.js
      - name: Test local candidate contact profile
        run: node browser-extension/candidate-local-profile.test.js
      - name: Test Setup & Readiness states
        run: node browser-extension/setup-readiness.test.js
      - name: Test post-submission application continuation
        run: node browser-extension/application-continuation.test.js
      - name: Test HH website Autopilot selection
        run: node browser-extension/browser-autopilot.test.js
      - name: Test one-click HH response and cover-letter continuation
        run: node browser-extension/site-apply.test.js
      - name: Test HH browser discovery
        run: node browser-extension/hh-discovery.test.js
      - name: Test floating panel policy
        run: node browser-extension/floating-panel.test.js
      - name: Test popup timeout and recovery behavior
        run: node browser-extension/runtime-guard.test.js
      - name: Validate dashboard inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          pages = [
              "src/JobSearchAssistant/wwwroot/index.html",
              "src/JobSearchAssistant/wwwroot/queue.html",
              "src/JobSearchAssistant/wwwroot/followups.html",
              "src/JobSearchAssistant/wwwroot/analytics.html",
          ]
          output = Path("/tmp/vja-inline-js")
          output.mkdir(parents=True, exist_ok=True)
          for page in pages:
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
              for index, script in enumerate(scripts):
                  (output / f"{Path(page).stem}-{index}.js").write_text(script, encoding="utf-8")
          PY
          for file in /tmp/vja-inline-js/*.js; do node --check "$file"; done
