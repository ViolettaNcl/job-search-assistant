name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: hashFiles('src/JobSearchAssistant/JobSearchAssistant.csproj') != ''
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify repository hygiene
        run: python tools/check-repo-hygiene.py

      - name: Restore backend
        if: hashFiles('src/JobSearchAssistant/JobSearchAssistant.csproj') != ''
        run: dotnet restore src/JobSearchAssistant/JobSearchAssistant.csproj
      - name: Build backend
        if: hashFiles('src/JobSearchAssistant/JobSearchAssistant.csproj') != ''
        run: dotnet build src/JobSearchAssistant/JobSearchAssistant.csproj -c Release --no-restore
      - name: Test backend
        if: hashFiles('tests/JobSearchAssistant.Tests/JobSearchAssistant.Tests.csproj') != ''
        run: dotnet test tests/JobSearchAssistant.Tests/JobSearchAssistant.Tests.csproj -c Release

      - name: Syntax-check extension JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find browser-extension -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Run extension unit/regression tests
        run: node --test browser-extension/*.test.js

      - name: Verify release metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('browser-extension/manifest.json','utf8'));
          const path='src/JobSearchAssistant/JobSearchAssistant.csproj';
          const project=fs.existsSync(path)?fs.readFileSync(path,'utf8'):'';
          const backendVersion=project.match(/<Version>([^<]+)<\/Version>/)?.[1] || 'NOT RUN: backend source not in this checkout';
          if(!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error(`Invalid extension version: ${manifest.version}`);
          console.log(`Extension release: ${manifest.version}; compatible backend source release: ${backendVersion}`);
          NODE

      - name: Product Center worker regression
        run: node tests/product_worker_600.cjs
      - name: Product ML regression
        run: python -m unittest discover -s tests -p 'test_product_ml.py' -v

      - name: RC3 real worker authorization gate
        run: node tests/worker_authorization_rc3.cjs
      - name: All Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
