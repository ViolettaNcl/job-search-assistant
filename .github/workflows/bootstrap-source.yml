name: bootstrap-source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand complete source bundle
        run: |
          tar -xzf .deploy/job-search-source.tar.gz --strip-components=1
          rm -rf .deploy
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add complete Job Search Assistant source"
          git push origin HEAD:main
