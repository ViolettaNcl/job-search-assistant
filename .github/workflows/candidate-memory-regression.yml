name: candidate-memory-regression
on:
  push:
    paths: ['browser-extension/**', 'tests/browser_e2e.py', 'tests/worker-bridge.cjs', 'tests/fixtures/**', '.github/workflows/candidate-memory-regression.yml']
  pull_request:
    paths: ['browser-extension/**', 'tests/browser_e2e.py', 'tests/worker-bridge.cjs', 'tests/fixtures/**', '.github/workflows/candidate-memory-regression.yml']
permissions:
  contents: read
jobs:
  evidence-and-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all extension unit tests
        run: node --test browser-extension/*.test.js
      - name: Install isolated browser fixture runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run offline DOM and actual-worker regression
        run: python tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-memory-test-results
          path: test-results/
          if-no-files-found: ignore
