name: package-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - 'src/JobSearchAssistant/**'
      - 'start-assistant.cmd'
      - 'STOP_ASSISTANT.cmd'
      - 'BACKEND_DIAGNOSTICS.cmd'
      - 'UPDATE_EXISTING.cmd'
      - 'tools/**'
      - '.github/workflows/package-windows.yml'
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'src/JobSearchAssistant/**'
      - 'start-assistant.cmd'
      - 'STOP_ASSISTANT.cmd'
      - 'BACKEND_DIAGNOSTICS.cmd'
      - 'UPDATE_EXISTING.cmd'
      - 'tools/**'
      - '.github/workflows/package-windows.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      has_backend: ${{ steps.source.outputs.has_backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend source
        id: source
        shell: pwsh
        run: |
          $available = Test-Path 'src/JobSearchAssistant/JobSearchAssistant.csproj'
          "has_backend=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) { 'Windows backend packaging: NOT RUN — C# source is absent.' >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/setup-dotnet@v4
        if: steps.source.outputs.has_backend == 'true' 
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows backend
        if: steps.source.outputs.has_backend == 'true'
        shell: pwsh
        run: |
          dotnet restore src/JobSearchAssistant/JobSearchAssistant.csproj -r win-x64
          dotnet publish src/JobSearchAssistant/JobSearchAssistant.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o dist/Violetta-Apply-Assistant/backend

      - name: Assemble current extension and launcher
        if: steps.source.outputs.has_backend == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Violetta-Apply-Assistant/extension | Out-Null
          Copy-Item browser-extension/* dist/Violetta-Apply-Assistant/extension -Recurse -Force
          Copy-Item start-assistant.cmd dist/Violetta-Apply-Assistant/start-assistant.cmd -Force
          Copy-Item STOP_ASSISTANT.cmd,BACKEND_DIAGNOSTICS.cmd,UPDATE_EXISTING.cmd dist/Violetta-Apply-Assistant/ -Force
          if (Test-Path user-settings.example.cmd) { Copy-Item user-settings.example.cmd dist/Violetta-Apply-Assistant/ -Force }
          if (Test-Path tools) { Copy-Item tools dist/Violetta-Apply-Assistant/tools -Recurse -Force }
          foreach ($file in @('README.md','ARCHITECTURE.md','IMPLEMENTATION_STATUS.md','SUPPORTED_SITES.md','TESTING_GUIDE.md','WHAT_CHANGED.md','SECURITY.md','ROADMAP.md','START_HERE.txt')) {
            if (Test-Path $file) { Copy-Item $file dist/Violetta-Apply-Assistant/ -Force }
          }
          if (-not (Test-Path dist/Violetta-Apply-Assistant/backend/JobSearchAssistant.exe)) { throw 'Backend executable missing.' }
          if (-not (Test-Path dist/Violetta-Apply-Assistant/extension/manifest.json)) { throw 'Extension manifest missing.' }

      - name: Verify package metadata
        if: steps.source.outputs.has_backend == 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json
          $project = Get-Content src/JobSearchAssistant/JobSearchAssistant.csproj -Raw
          $backendVersion = [regex]::Match($project, '<Version>([^<]+)</Version>').Groups[1].Value
          if ($manifest.version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid extension version: $($manifest.version)" }
          Write-Host "Extension release: $($manifest.version); compatible backend source release: $backendVersion"

      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.has_backend == 'true'
        with:
          name: violetta-apply-assistant-windows
          path: dist/Violetta-Apply-Assistant/
          if-no-files-found: error
          retention-days: 30

  verify-downloaded-package:
    needs: package
    if: needs.package.outputs.has_backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: violetta-apply-assistant-windows
          path: downloaded
      - name: Verify required packaged files
        shell: pwsh
        run: |
          $required = @(
            'backend/JobSearchAssistant.exe',
            'backend/JobSearchAssistant.dll',
            'extension/manifest.json',
            'extension/home.html',
            'extension/icons/icon128.png',
            'start-assistant.cmd',
            'STOP_ASSISTANT.cmd',
            'BACKEND_DIAGNOSTICS.cmd'
          )
          foreach ($file in $required) { if (-not (Test-Path "downloaded/$file")) { throw "Missing packaged file: $file" } }
          Get-FileHash downloaded/backend/JobSearchAssistant.exe -Algorithm SHA256
