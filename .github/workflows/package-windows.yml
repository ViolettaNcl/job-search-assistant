name: package-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - 'src/JobSearchAssistant/**'
      - 'scripts/**'
      - '.github/workflows/package-windows.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows backend
        shell: pwsh
        run: |
          dotnet restore src/JobSearchAssistant/JobSearchAssistant.csproj -r win-x64
          dotnet publish src/JobSearchAssistant/JobSearchAssistant.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o dist/Violetta-Apply-Assistant/backend

      - name: Assemble extension and launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Violetta-Apply-Assistant/extension | Out-Null
          Copy-Item browser-extension/* dist/Violetta-Apply-Assistant/extension -Recurse -Force
          Copy-Item scripts/start-assistant-windows.cmd dist/Violetta-Apply-Assistant/start-assistant.cmd -Force
          Copy-Item scripts/user-settings.example.cmd dist/Violetta-Apply-Assistant/user-settings.example.cmd -Force
          Copy-Item scripts/START_HERE.txt dist/Violetta-Apply-Assistant/START_HERE.txt -Force

          if (-not (Test-Path 'dist/Violetta-Apply-Assistant/backend/JobSearchAssistant.exe')) {
            throw 'Published Windows backend executable is missing.'
          }
          if (-not (Test-Path 'dist/Violetta-Apply-Assistant/extension/manifest.json')) {
            throw 'Packaged Chrome extension manifest is missing.'
          }

      - name: Create downloadable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/Violetta-Apply-Assistant/* `
            -DestinationPath dist/Violetta-Apply-Assistant-Windows.zip `
            -CompressionLevel Optimal `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: violetta-apply-assistant-windows
          path: dist/Violetta-Apply-Assistant-Windows.zip
          if-no-files-found: error
          retention-days: 30

  verify-downloaded-package:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: violetta-apply-assistant-windows
          path: downloaded
      - name: Inspect downloaded ZIP and bundled runtime
        shell: pwsh
        run: |
          Expand-Archive downloaded/Violetta-Apply-Assistant-Windows.zip -DestinationPath verified
          $required = @('backend/JobSearchAssistant.exe', 'backend/JobSearchAssistant.dll',
            'backend/coreclr.dll', 'backend/hostfxr.dll', 'backend/JobSearchAssistant.runtimeconfig.json',
            'backend/wwwroot/index.html', 'extension/manifest.json', 'start-assistant.cmd', 'START_HERE.txt')
          foreach ($file in $required) {
            if (-not (Test-Path "verified/$file")) { throw "Missing packaged file: $file" }
          }
          $source = Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json
          $packaged = Get-Content verified/extension/manifest.json -Raw | ConvertFrom-Json
          if ($source.version -ne $packaged.version) { throw 'Packaged version differs from source.' }
          Write-Host "Verified downloaded extension version: $($packaged.version)"
          Get-FileHash downloaded/Violetta-Apply-Assistant-Windows.zip -Algorithm SHA256
      - name: Run packaged Windows executable and verify SQLite restart
        run: python scripts/verify-sqlite-runtime.py verified/backend/JobSearchAssistant.exe
