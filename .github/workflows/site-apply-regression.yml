name: site-apply-regression

on:
  pull_request:
    paths:
      - 'browser-extension/**'
      - '.github/workflows/site-apply-regression.yml'
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/site-apply-regression.yml'

permissions:
  contents: read

jobs:
  site-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check application automation
        run: |
          node --check browser-extension/site-apply.js
          node --check browser-extension/site-apply-content.js
          node --check browser-extension/site-apply-popup.js
          node --check browser-extension/final-submit-control.js
          node --check browser-extension/phone-only-ui.js
          node --check browser-extension/hh-site-mode-options.js
          node --check browser-extension/candidate-local-profile.js
          node --check browser-extension/setup-readiness.js
          node --check browser-extension/options.js
      - name: Run one-click application safeguards
        run: node browser-extension/site-apply.test.js
      - name: Run final Send control safeguards
        run: node browser-extension/final-submit-control.test.js
      - name: Run phone-only contact regression tests
        run: node browser-extension/candidate-local-profile.test.js
      - name: Run setup readiness regression tests
        run: node browser-extension/setup-readiness.test.js
      - name: Verify manifest release wiring
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('browser-extension/manifest.json', 'utf8'));
          if (manifest.version !== '2.6.0') throw new Error(`Unexpected extension version ${manifest.version}`);
          const scripts = manifest.content_scripts.flatMap(x => x.js || []);
          for (const required of ['site-apply.js', 'site-apply-content.js', 'cv-upload.js', 'final-submit-control.js', 'submission-receipt.js']) {
            if (!scripts.includes(required)) throw new Error(`Manifest is missing ${required}`);
          }
          const popup = fs.readFileSync('browser-extension/site-apply-popup.js', 'utf8');
          if (/Apply on this employer site now\?/.test(popup)) throw new Error('Apply + send still has a redundant second confirmation.');
          if (!popup.includes('Apply + send now')) throw new Error('Immediate-send button is missing.');
          if (!popup.includes('vjaOneClickApply')) throw new Error('Top-level one-click application handler is missing.');
          NODE
