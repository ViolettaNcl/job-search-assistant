name: site-apply-regression

on:
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'src/JobSearchAssistant/wwwroot/**'
      - 'scripts/verify-*.cjs'
      - '.github/workflows/site-apply-regression.yml'
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - 'src/JobSearchAssistant/wwwroot/**'
      - 'scripts/verify-*.cjs'
      - '.github/workflows/site-apply-regression.yml'

permissions:
  contents: read

jobs:
  site-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check application automation
        run: |
          node --check browser-extension/site-apply.js
          node --check browser-extension/site-apply-content.js
          node --check browser-extension/site-apply-popup.js
          node --check browser-extension/background.js
          node --check browser-extension/browser-autopilot.js
          node --check browser-extension/runtime-guard.js
          node --check browser-extension/final-submit-control.js
          node --check browser-extension/phone-only-ui.js
          node --check browser-extension/hh-site-mode-options.js
          node --check browser-extension/candidate-local-profile.js
          node --check browser-extension/setup-readiness.js
          node --check browser-extension/options.js
      - name: Run one-click application safeguards
        run: node browser-extension/site-apply.test.js
      - name: Run browser Autopilot safeguards
        run: node browser-extension/browser-autopilot.test.js
      - name: Run popup hang recovery safeguards
        run: node browser-extension/runtime-guard.test.js
      - name: Run final Send control safeguards
        run: node browser-extension/final-submit-control.test.js
      - name: Run phone-only contact regression tests
        run: node browser-extension/candidate-local-profile.test.js
      - name: Run setup readiness regression tests
        run: node browser-extension/setup-readiness.test.js
      - name: Verify manifest release wiring
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('browser-extension/manifest.json', 'utf8'));
          const project = fs.readFileSync('src/JobSearchAssistant/JobSearchAssistant.csproj', 'utf8');
          const version = project.match(/<Version>([^<]+)<\/Version>/)?.[1];
          if (!version || manifest.version !== version) throw new Error(`Extension ${manifest.version} and backend ${version} release versions differ`);
          const scripts = manifest.content_scripts.flatMap(x => x.js || []);
          for (const required of ['site-apply.js', 'site-apply-content.js', 'cv-upload.js', 'final-submit-control.js', 'submission-receipt.js']) {
            if (!scripts.includes(required)) throw new Error(`Manifest is missing ${required}`);
          }
          const popup = fs.readFileSync('browser-extension/site-apply-popup.js', 'utf8');
          if (/Apply on this employer site now\?/.test(popup)) throw new Error('Apply + send still has a redundant second confirmation.');
          if (!popup.includes('Apply + send now')) throw new Error('Immediate-send button is missing.');
          if (!popup.includes('vjaOneClickApply')) throw new Error('Top-level one-click application handler is missing.');
          const popupHtml = fs.readFileSync('browser-extension/popup.html', 'utf8');
          if (!popupHtml.includes('<script src="runtime-guard.js"></script>')) throw new Error('Popup runtime timeout guard is missing.');
          if (!popupHtml.includes('<script src="site-apply.js"></script>')) throw new Error('Popup is missing the shared site-apply safeguards.');
          const content = fs.readFileSync('browser-extension/content.js', 'utf8');
          if (!content.includes('if (!handled.has(message?.type)) return false;')) throw new Error('Content listener still claims unrelated message channels.');
          NODE

  floating-panel-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: npm install --prefix /tmp/vja-browser-tests playwright@1.58.2
      - name: Install Chromium
        run: /tmp/vja-browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify floating extension in Chromium with a local fixture
        env:
          NODE_PATH: /tmp/vja-browser-tests/node_modules
        run: node scripts/verify-floating-panel.cjs

      - name: Verify HH redirect discovery, import and challenge stop in Chromium
        env:
          NODE_PATH: /tmp/vja-browser-tests/node_modules
        run: node scripts/verify-hh-discovery-redirect.cjs

      - name: Verify concurrent applications and closed-tab recovery in Chromium
        env:
          NODE_PATH: /tmp/vja-browser-tests/node_modules
        run: node scripts/verify-parallel-applications.cjs

      - name: Verify operator dashboard dates, review list and live refresh
        env:
          NODE_PATH: /tmp/vja-browser-tests/node_modules
        run: node scripts/verify-operator-dashboard.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-dashboard-previews
          path: artifacts/operator-*.png
          if-no-files-found: ignore
